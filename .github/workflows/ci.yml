name: CI

on:
  push:
    branches:
      - main
      - Bengisu_system
      - feedback_fine-tune
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend kalite kapısı
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v6

      - name: FFmpeg kur
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: uv ve Python kur
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Bağımlılıkları doğrula
        working-directory: backend
        run: uv sync --locked

      - name: Ruff çalıştır
        working-directory: backend
        run: uv run ruff check dortgoz tests

      - name: Backend testlerini çalıştır
        working-directory: backend
        run: uv run pytest -q

  frontend:
    name: Frontend kalite kapısı
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v6

      - name: Bun kur
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Bağımlılıkları doğrula
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend testlerini çalıştır
        working-directory: frontend
        run: bun test

      - name: TypeScript ve üretim derlemesini çalıştır
        working-directory: frontend
        run: bun run build
