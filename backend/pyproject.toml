[project]
name = "dortgoz-backend"
version = "0.1.0"
description = "Dörtgöz — ajan tabanlı video analiz ve karar destek sistemi (backend)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "langgraph>=0.2",
    "onnxruntime>=1.28.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    # Türkçe metindeki doğru tipografiyi ASCII'ye çevirmeyin.
    "RUF001",
    "RUF002",
    "RUF003",
    # FastAPI parametre bildirimleri fonksiyon varsayılanı kullanır.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Bu istisnalar mevcut borcu görünür tutar. Yeni dosyalar geniş kural setine uyar.
"dortgoz/api/router.py" = ["ASYNC230", "ASYNC240"]
"dortgoz/main.py" = ["ASYNC240", "B904"]
"dortgoz/pipeline/candidate_intervals.py" = ["B905", "RUF007"]
"dortgoz/pipeline/ingest.py" = ["B905"]
"dortgoz/pipeline/interpret.py" = ["B905", "RUF059"]
"dortgoz/pipeline/runner.py" = ["RUF005"]
"dortgoz/pipeline/temporal_cnn.py" = ["B905"]
"dortgoz/pipeline/windowing.py" = ["B905"]
"dortgoz/services/analysis_projection.py" = ["ASYNC240"]
"dortgoz/services/incident_media.py" = ["ASYNC240"]
"dortgoz/services/runtime_postprocess.py" = ["B904"]
"dortgoz/services/shadow_evaluation.py" = ["ASYNC240"]
"dortgoz/services/training_sample.py" = ["B905"]
"dortgoz/tools/keyframes.py" = ["B905"]
"dortgoz/ws.py" = ["ASYNC240", "B905"]
"tests/**/*.py" = ["ASYNC221", "ASYNC240", "B017", "B905", "RUF007", "RUF043"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dortgoz"]
